# cargo-deny configuration: supply-chain gates for the pinned dependency
# tree. Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = false

[advisories]
version = 2
# The pinned Zed graph currently contains yanked chacha20 0.10.1. Keep this
# visible as a warning until the upstream graph can move without a split lock.
yanked = "warn"
ignore = [
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0285",
]

[licenses]
version = 2
# PIKU deliberately avoids copyleft parser dependencies such as MuPDF's AGPL
# bindings. The pinned GPUI graph includes GPL-licensed optional platform
# support crates, so those licenses are listed explicitly rather than hidden
# behind a broad allow rule.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The zed forks ride along with the gpui dependency tree; the pin lives in
# the committed Cargo.lock (see the comment in Cargo.toml).
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/reqwest",
    "https://github.com/zed-industries/scap",
    # X Input Method support, reached only through gpui_linux's `x11` feature.
    "https://github.com/zed-industries/xim-rs",
    "https://github.com/longbridge/gpui-component",
]
