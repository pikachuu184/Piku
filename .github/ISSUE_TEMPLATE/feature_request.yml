name: Feature request
description: Suggest a new capability or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you are trying to solve, not only the solution you have in mind.
        Proposals that fit PIKU's monochrome, keyboard-driven design are the easiest to accept.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does PIKU get in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine this working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mock-ups, references to similar tools, or related issues.
    validations:
      required: false
