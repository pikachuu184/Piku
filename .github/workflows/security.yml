name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit
      # These advisories are currently reachable only through the pinned Zed/
      # GPUI graph. Keep the exceptions explicit until upstream publishes
      # compatible updates; the license and source policy remains enforced.
      - run: |
          cargo audit \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0285

  license-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
