name: Issue triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: Label, assign, and detect duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const normalize = value => value.toLowerCase()
              .replace(/^\s*\[.*?\]\s*/, '')
              .replace(/[^a-z0-9\s]/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
            const title = normalize(issue.title);
            const words = new Set(title.split(' ').filter(word => word.length > 2));

            for (const [name, color, description] of [
              ['triage', 'ededed', 'Needs initial maintainer triage'],
              ['duplicate', 'cfd3d7', 'This issue duplicates an existing report']
            ]) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: ['triage']
            });

            try {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: issue.number, assignees: [owner]
              });
            } catch (error) {
              core.warning(`Could not assign issue to ${owner}: ${error.message}`);
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100, sort: 'created', direction: 'desc'
            });
            const duplicate = openIssues.find(candidate => {
              if (candidate.number === issue.number || candidate.pull_request) return false;
              const candidateTitle = normalize(candidate.title);
              if (candidateTitle === title) return true;
              const candidateWords = new Set(candidateTitle.split(' ').filter(word => word.length > 2));
              const intersection = [...words].filter(word => candidateWords.has(word)).length;
              const union = new Set([...words, ...candidateWords]).size;
              return words.size >= 4 && union > 0 && intersection / union >= 0.9;
            });

            if (duplicate) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number, labels: ['duplicate']
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Thanks for the report. This appears to duplicate #${duplicate.number}. ` +
                  `Please continue the discussion there so fixes and updates stay together.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned'
              });
            }
