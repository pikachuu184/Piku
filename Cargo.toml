[package]
name = "piku"
version = "0.1.0"
edition = "2024"

[dependencies]
# Supply-chain pinning: the zed (gpui) crates are pinned via the committed
# Cargo.lock (rev f14fea9bf3c93797d5161f7440ed418655bc6c57) — a hard `rev=`
# here would split the graph from gpui-component's own un-revved gpui dep.
# The longbridge crates below ARE hard-pinned; bump deliberately, never
# implicitly (`cargo update` moves the zed pin — review before committing).
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "031555662e99a1b5a549990b47f246d475b8288a", features = ["tree-sitter", "tree-sitter-languages"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "031555662e99a1b5a549990b47f246d475b8288a" }

# Git backend: pure-Rust gitoxide — no C libgit2, no shelling out to git.exe.
# Defaults are curated (status, blob-diff, index, revision, attributes,
# credentials, worktree-mutation, zlib-rs). Added: blocking HTTPS fetch via
# reqwest+schannel (OS TLS, no C build) and tree-editor for commit creation.
# NOT enabled on purpose: max-performance (pulls zlib-ng/C).
gix = { version = "0.85", features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-native-tls",
    "tree-editor",
] }

# Async backend runtime. Deliberately narrow: PIKU opens no sockets, so `net`
# and the IO driver are off. What Tokio is actually here for is the primitives
# gpui's executor lacks — CancellationToken, Semaphore, bounded mpsc,
# TaskTracker, timers — plus `spawn_blocking` for filesystem work (there is no
# true async local filesystem; `tokio::fs` is spawn_blocking internally, so we
# call it once per logical operation rather than per syscall).
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# CPU-bound fan-out (hashing, image decode). Kept separate from Tokio's
# blocking pool, which is sized for I/O waits, not for saturating cores.
rayon = "1"
# Lighter than std for the short critical sections around the caches.
parking_lot = "0.12"

# Windows path normalization. `canonicalize` returns `\\?\` verbatim paths;
# this returns the plain-disk spelling when that is unambiguously safe. On
# non-Windows every entry point is a compile-time no-op. Already in the tree
# transitively via gix.
dunce = "1"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
trash = "5"
dirs = "6"
open = "5"
chrono = "0.4"
sysinfo = "0.33"

# Preview engine (all permissive MIT/Apache-2.0; default features trimmed to
# keep the dependency tree and build time down).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
lofty = "0.22"
# Already in the lock file as a gpui-component dependency; promoting it to a
# direct one costs nothing and lets `markdown_safe` parse with the *exact*
# parser and options the renderer uses, so spans line up byte-for-byte.
markdown = "1"
# Audio playback + decoding (rodio bundles symphonia; broaden codec coverage).
rodio = { version = "0.20", features = ["symphonia-all"] }
# Pure-Rust MP4/MOV metadata (duration, resolution, codec) — no ffmpeg needed.
mp4 = "0.14"
# Video posters/thumbnails: drives a standalone ffmpeg binary as an isolated
# subprocess (no C linking). The binary is fetched at build time (see build.rs)
# and resolved at runtime; absent → video previews degrade to metadata only.
ffmpeg-sidecar = "2"
# PDF rendering. The crate compiles without the native pdfium library present;
# the library is loaded at runtime and PDF previews degrade gracefully if it is
# missing.
pdfium-render = "0.8"
# Structured-data tree: parse TOML/YAML into a common serde model (JSON is
# already covered by serde_json).
toml = "0.8"
serde_yml = "0.0.12"

# gpui_platform's Linux/FreeBSD windowing backends are opt-in features and
# default to off, so a build without them links fine and then panics at
# startup with "At least one of the wayland or x11 features must be enabled".
# Enabling both lets one binary pick its backend at runtime. Features are
# unioned with the base declaration above, and this whole block is inert on
# Windows and macOS, which have their own backends.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }

[build-dependencies]
# Downloads the standalone ffmpeg binary at build time so it ships with the app
# (best-effort: a build without network still succeeds, just without video).
ffmpeg-sidecar = "2"

# Windows-only: embed the taskbar/app icon resource into the executable.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.dev]
debug = "limited"

[profile.release]
lto = "thin"
